<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>막바지 작전실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --bg2: #111827;
    --bg3: #1a2235;
    --bg4: #1f2d44;
    --border: #2a3a52;
    --border2: #3a4f6a;
    --gold: #e6b450;
    --gold2: #f5c842;
    --gold-dim: rgba(230,180,80,0.15);
    --blue: #6ea8ff;
    --green: #5fd0a0;
    --green-dim: rgba(95,208,160,0.15);
    --red: #ff6b6b;
    --text: #d4dce8;
    --text2: #8898aa;
    --text3: #556070;
    --tag-h: #e6b450;
    --tag-f: #6ea8ff;
    --tag-p: #5fd0a0;
    --tag-x: #8898aa;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
  header { background: linear-gradient(180deg, #0d1520 0%, var(--bg2) 100%); border-bottom: 1px solid var(--border); padding: 20px 20px 0; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .header-title h1 { font-family: 'Nanum Myeongjo', serif; font-size: 22px; font-weight: 800; color: var(--gold); letter-spacing: 0.02em; line-height: 1.2; }
  .header-title p { font-size: 11px; color: var(--text2); margin-top: 2px; letter-spacing: 0.15em; text-transform: uppercase; }
  .dday-box { display: flex; align-items: center; gap: 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; flex-shrink: 0; }
  .dday-label { font-size: 11px; color: var(--text2); letter-spacing: 0.1em; }
  .dday-count { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; color: var(--gold); line-height: 1; }
  .dday-count span { font-size: 14px; color: var(--text2); margin-left: 2px; }
  .dday-input { background: var(--bg4); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 4px 8px; cursor: pointer; outline: none; width: 130px; }
  .dday-input:focus { border-color: var(--gold); color: var(--text); }
  .tabs { display: flex; gap: 2px; margin-top: 4px; }
  .tab-btn { background: none; border: none; color: var(--text3); font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; font-weight: 500; padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  main { max-width: 800px; margin: 0 auto; padding: 20px 16px 60px; }
  .tab-panel { display: none; animation: fadeIn 0.2s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card-title { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
  .stage-bar { display: flex; gap: 6px; margin-bottom: 20px; }
  .stage-step { flex: 1; height: 6px; background: var(--bg4); border-radius: 3px; transition: background 0.3s; }
  .stage-step.done { background: var(--gold); opacity: 0.5; }
  .stage-step.current { background: var(--gold); opacity: 1; box-shadow: 0 0 8px rgba(230,180,80,0.5); }
  .stage-labels { display: flex; gap: 6px; margin-bottom: 16px; margin-top: 4px; }
  .stage-label { flex: 1; font-size: 9px; color: var(--text3); text-align: center; transition: color 0.3s; }
  .stage-label.current { color: var(--gold); font-weight: 600; }
  .stage-label.done { color: var(--text2); }
  .stage-info { background: var(--bg3); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 16px; }
  .stage-info h2 { font-family: 'Nanum Myeongjo', serif; font-size: 16px; color: var(--gold); margin-bottom: 6px; }
  .stage-info p { font-size: 12px; color: var(--text2); line-height: 1.6; }
  .stage-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .stage-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text2); }
  .stage-count { font-size: 12px; color: var(--text); font-weight: 600; }
  .tasks-progress-bar { width: 100%; height: 4px; background: var(--bg4); border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
  .tasks-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 2px; transition: width 0.3s ease; }
  .task-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  .task-item:hover { border-color: var(--border2); background: var(--bg4); }
  .task-item.checked { opacity: 0.55; }
  .task-check { width: 20px; height: 20px; border: 2px solid var(--border2); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .task-item.checked .task-check { background: var(--gold); border-color: var(--gold); }
  .task-check svg { display: none; }
  .task-item.checked .task-check svg { display: block; }
  .task-text { flex: 1; font-size: 13px; color: var(--text); transition: color 0.2s; }
  .task-item.checked .task-text { text-decoration: line-through; color: var(--text3); }
  .tag { font-size: 9px; font-weight: 600; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }
  .tag-h { background: rgba(230,180,80,0.18); color: var(--tag-h); }
  .tag-f { background: rgba(110,168,255,0.18); color: var(--tag-f); }
  .tag-p { background: rgba(95,208,160,0.18); color: var(--tag-p); }
  .tag-x { background: rgba(136,152,170,0.18); color: var(--tag-x); }
  .hoedok-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
  .hoedok-subject { font-size: 12px; font-weight: 600; width: 56px; flex-shrink: 0; color: var(--text); }
  .hoedok-type { font-size: 11px; color: var(--text2); width: 30px; flex-shrink: 0; }
  .hoedok-progress { flex: 1; }
  .hoedok-bar { width: 100%; height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .hoedok-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .fill-h { background: linear-gradient(90deg, #c89a30, var(--gold)); }
  .fill-f { background: linear-gradient(90deg, #4a80e0, var(--blue)); }
  .fill-p { background: linear-gradient(90deg, #3faa80, var(--green)); }
  .hoedok-nums { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text2); }
  .hoedok-nums strong { color: var(--text); }
  .hoedok-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ctrl-btn { width: 28px; height: 28px; background: var(--bg4); border: 1px solid var(--border2); border-radius: 50%; color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, border-color 0.2s; line-height: 1; padding: 0; }
  .ctrl-btn:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
  .ctrl-btn.plus { font-size: 18px; }
  .target-edit { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); cursor: pointer; white-space: nowrap; border-bottom: 1px dashed var(--border2); padding-bottom: 1px; }
  .target-edit:hover { color: var(--text2); border-color: var(--border); }
  .score-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-size: 10px; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; }
  .form-input, .form-select { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; padding: 7px 10px; outline: none; transition: border-color 0.2s; }
  .form-input:focus, .form-select:focus { border-color: var(--gold); }
  .form-input[type="number"] { width: 80px; }
  .form-input[type="date"] { width: 140px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .form-select { min-width: 90px; }
  .btn-primary { background: var(--gold); border: none; border-radius: var(--radius-sm); color: #0b0f1a; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; font-weight: 700; padding: 8px 16px; cursor: pointer; transition: background 0.2s, transform 0.1s; align-self: flex-end; }
  .btn-primary:hover { background: var(--gold2); }
  .btn-primary:active { transform: scale(0.97); }
  .chart-wrap { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 16px; overflow: hidden; }
  .chart-wrap svg { display: block; width: 100%; }
  .chart-empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; }
  .chart-legend { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .score-list { list-style: none; }
  .score-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; }
  .score-date { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text2); flex-shrink: 0; }
  .score-sub { flex: 1; font-size: 12px; }
  .score-val { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; min-width: 36px; text-align: right; }
  .score-del { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text3); font-size: 12px; cursor: pointer; padding: 3px 8px; transition: all 0.2s; }
  .score-del:hover { border-color: var(--red); color: var(--red); }
  .weak-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .weak-text-input { flex: 1; min-width: 180px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; padding: 8px 12px; outline: none; transition: border-color 0.2s; }
  .weak-text-input:focus { border-color: var(--gold); }
  .weak-list { list-style: none; }
  .weak-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 7px; transition: opacity 0.2s; }
  .weak-item.done { opacity: 0.45; }
  .weak-content { flex: 1; font-size: 13px; line-height: 1.5; }
  .weak-item.done .weak-content { text-decoration: line-through; color: var(--text2); }
  .weak-actions { display: flex; gap: 6px; flex-shrink: 0; margin-top: 1px; }
  .weak-resolve-btn, .weak-del-btn { background: none; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; cursor: pointer; padding: 3px 8px; transition: all 0.2s; white-space: nowrap; }
  .weak-resolve-btn { color: var(--green); }
  .weak-resolve-btn:hover { border-color: var(--green); background: var(--green-dim); }
  .weak-item.done .weak-resolve-btn { color: var(--text3); }
  .weak-item.done .weak-resolve-btn:hover { border-color: var(--border2); background: none; color: var(--text2); }
  .weak-del-btn { color: var(--text3); }
  .weak-del-btn:hover { border-color: var(--red); color: var(--red); }
  .weak-empty { text-align: center; padding: 30px; color: var(--text3); font-size: 13px; }
  #toast { position: fixed; bottom: 24px; right: 20px; background: var(--bg3); border: 1px solid var(--border2); border-left: 3px solid var(--green); border-radius: var(--radius-sm); color: var(--text); font-size: 12px; padding: 8px 14px; opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 600px) {
    .header-top { flex-direction: column; gap: 10px; }
    .dday-box { justify-content: space-between; }
    .tab-btn { padding: 10px 10px; font-size: 12px; }
    .hoedok-row { flex-wrap: wrap; }
    .score-form, .weak-form { flex-direction: column; }
    .form-input[type="date"], .form-input[type="number"], .form-select { width: 100%; }
  }
  .section-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.12em; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .no-data { text-align: center; padding: 20px; color: var(--text3); font-size: 13px; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
  option { background: var(--bg2); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-title">
      <h1>막바지 작전실</h1>
      <p>헌법 &middot; 형사법 &middot; 경찰학</p>
    </div>
    <div class="dday-box">
      <div>
        <div class="dday-label">D-DAY</div>
        <div class="dday-count" id="dday-display">—<span>일</span></div>
      </div>
      <div>
        <div class="dday-label">시험일</div>
        <input type="date" class="dday-input" id="exam-date-input">
      </div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="todo">오늘 할 일</button>
    <button class="tab-btn" data-tab="hoedok">회독 진행률</button>
    <button class="tab-btn" data-tab="scores">점수 추이</button>
    <button class="tab-btn" data-tab="weak">약점노트</button>
  </nav>
</header>

<main>
  <div class="tab-panel active" id="tab-todo">
    <div class="stage-bar" id="stage-bar"></div>
    <div class="stage-labels" id="stage-labels"></div>
    <div class="stage-info" id="stage-info"></div>
    <div class="stage-meta">
      <div class="stage-date" id="today-date"></div>
      <div class="stage-count" id="tasks-count"></div>
    </div>
    <div class="tasks-progress-bar"><div class="tasks-progress-fill" id="tasks-progress-fill"></div></div>
    <div id="tasks-list"></div>
  </div>

  <div class="tab-panel" id="tab-hoedok">
    <div class="card">
      <div class="card-title">이론 회독</div>
      <div id="hoedok-theory"></div>
    </div>
    <div class="card">
      <div class="card-title">기출 회독</div>
      <div id="hoedok-past"></div>
    </div>
    <p style="font-size:11px;color:var(--text3);text-align:center;margin-top:8px;">목표 회독수는 숫자를 클릭하여 수정</p>
  </div>

  <div class="tab-panel" id="tab-scores">
    <div class="card">
      <div class="card-title">점수 기록</div>
      <div class="score-form">
        <div class="form-group">
          <label class="form-label">날짜</label>
          <input type="date" class="form-input" id="score-date">
        </div>
        <div class="form-group">
          <label class="form-label">과목</label>
          <select class="form-select" id="score-sub">
            <option value="헌법">헌법</option>
            <option value="형사법">형사법</option>
            <option value="경찰학">경찰학</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">점수 (0~40)</label>
          <input type="number" class="form-input" id="score-val" min="0" max="40" placeholder="32">
        </div>
        <button class="btn-primary" id="score-add-btn">기록</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">점수 추이</div>
      <div id="score-chart-wrap"></div>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#e6b450"></div>헌법</div>
        <div class="legend-item"><div class="legend-dot" style="background:#6ea8ff"></div>형사법</div>
        <div class="legend-item"><div class="legend-dot" style="background:#5fd0a0"></div>경찰학</div>
      </div>
    </div>
    <div class="section-label">기록 목록</div>
    <ul class="score-list" id="score-list"></ul>
  </div>

  <div class="tab-panel" id="tab-weak">
    <div class="card">
      <div class="card-title">약점 추가</div>
      <div class="weak-form">
        <select class="form-select" id="weak-sub">
          <option value="헌법">헌법</option>
          <option value="형사법">형사법</option>
          <option value="경찰학">경찰학</option>
        </select>
        <input type="text" class="weak-text-input" id="weak-text" placeholder="틀린 개념, 판례, 조문…">
        <button class="btn-primary" id="weak-add-btn">추가</button>
      </div>
    </div>
    <ul class="weak-list" id="weak-list"></ul>
    <div class="weak-empty" id="weak-empty" style="display:none">아직 등록된 약점이 없습니다.</div>
  </div>
</main>

<div id="toast">저장됨</div>

<script>
const STORAGE_KEY = 'fyg_data';
const SUB_COLORS = { '헌법': '#e6b450', '형사법': '#6ea8ff', '경찰학': '#5fd0a0' };
const SUB_ORDER = ['헌법', '형사법', '경찰학'];

const STAGES = [
  {
    name: '1단계 · 단권화 & 약점 색출', short: '단권화',
    desc: '이론서를 처음부터 다시 보지 말고, 회독하며 모르는 것만 단권화 노트 한 권에 몰아넣기. 기출 1회독 병행하며 약점 파트 표시.',
    tasks: [
      { id:'t0', text:'헌법 이론 회독 + 단권화 (조문·판례)', tag:'h' },
      { id:'t1', text:'형사법 기출 1회독 (틀린 것 표시)', tag:'f' },
      { id:'t2', text:'경찰학 두문자·암기 정리', tag:'x' },
      { id:'t3', text:'단권화 노트 10분 점검', tag:'p' },
      { id:'t4', text:'체력 가볍게 유지', tag:'x' },
    ]
  },
  {
    name: '2단계 · 기출 회독 가속', short: '기출',
    desc: '기출 2~3회독으로 압축. 맞은 건 넘기고 틀린·헷갈린 문제만 반복. 오답은 "왜 틀렸는지" 한 줄 분류(개념/실수/함정).',
    tasks: [
      { id:'t0', text:'형사법 기출 2~3회독 (오답만)', tag:'f' },
      { id:'t1', text:'헌법 기출 + 판례 정리', tag:'h' },
      { id:'t2', text:'경찰학 기출 + 암기 점검', tag:'x' },
      { id:'t3', text:'오답노트 정리 → 약점노트 등록', tag:'p' },
      { id:'t4', text:'체력 가볍게 유지', tag:'x' },
    ]
  },
  {
    name: '3단계 · 실전 전환', short: '실전',
    desc: '시간 재고 푸는 습관 들이기. 실전 모의고사 주 2~3회, 한 타임에 풀고 채점 → 약점 즉시 보강. 점수 추이 기록.',
    tasks: [
      { id:'t0', text:'실전 모의고사 1타임 (시간 엄수)', tag:'p' },
      { id:'t1', text:'모의 채점 + 점수 기록', tag:'p' },
      { id:'t2', text:'취약 과목 집중 보강', tag:'x' },
      { id:'t3', text:'단권화·약점노트 회독', tag:'x' },
      { id:'t4', text:'체력 최저기준 점검', tag:'x' },
    ]
  },
  {
    name: '4단계 · 최종 점검', short: '최종',
    desc: '새 건 안 봄. 전과목 모의고사 + 단권화·오답노트 회독만 반복. 마지막 주 암기 정점, 수면·컨디션·시험장 시뮬레이션 집중.',
    tasks: [
      { id:'t0', text:'전과목 모의고사 (실전 시뮬레이션)', tag:'p' },
      { id:'t1', text:'헌법 조문·판례 최종 암기', tag:'h' },
      { id:'t2', text:'형사법 판례 최종 암기', tag:'f' },
      { id:'t3', text:'경찰학 암기 마무리', tag:'x' },
      { id:'t4', text:'수면·컨디션 관리 (체력 휴식)', tag:'x' },
    ]
  }
];
const STAGE_STARTS = [0, 3, 5, 7];

function defaultData() {
  return {
    examDate: '2026-08-29',
    hoedok: {
      '헌법':   { theory:0, past:0, tTarget:3, pTarget:4 },
      '형사법': { theory:0, past:0, tTarget:3, pTarget:4 },
      '경찰학': { theory:0, past:0, tTarget:3, pTarget:4 },
    },
    scores: [], weak: [], checks: {},
  };
}

let data = (() => {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return defaultData();
})();

let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); showToast(); }, 300);
}

let toastTimer;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(a) - new Date(b)) / 86400000); }

function getStageIndex(examDate) {
  const rem = daysBetween(examDate, todayStr());
  if (rem <= 0) return 3;
  const elapsed = Math.min(Math.max(9 - Math.ceil(rem / 7), 0), 8);
  for (let i = STAGE_STARTS.length - 1; i >= 0; i--) { if (elapsed >= STAGE_STARTS[i]) return i; }
  return 0;
}

function renderDday() {
  document.getElementById('exam-date-input').value = data.examDate;
  const rem = daysBetween(data.examDate, todayStr());
  const el = document.getElementById('dday-display');
  if (rem < 0) el.innerHTML = `+${Math.abs(rem)}<span>일 경과</span>`;
  else if (rem === 0) el.innerHTML = `D-DAY<span></span>`;
  else el.innerHTML = `${rem}<span>일</span>`;
}

document.getElementById('exam-date-input').addEventListener('change', e => {
  data.examDate = e.target.value; save(); renderDday(); renderTodo();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'scores') renderScoreChart();
  });
});

function renderTodo() {
  const si = getStageIndex(data.examDate);
  const stage = STAGES[si];
  const dk = todayStr();
  const dc = data.checks[dk] || {};

  const bar = document.getElementById('stage-bar'), lbels = document.getElementById('stage-labels');
  bar.innerHTML = ''; lbels.innerHTML = '';
  STAGES.forEach((s, i) => {
    const st = document.createElement('div');
    st.className = 'stage-step' + (i < si ? ' done' : i === si ? ' current' : '');
    bar.appendChild(st);
    const lb = document.createElement('div');
    lb.className = 'stage-label' + (i < si ? ' done' : i === si ? ' current' : '');
    lb.textContent = s.short; lbels.appendChild(lb);
  });

  document.getElementById('stage-info').innerHTML = `<h2>${stage.name}</h2><p>${stage.desc}</p>`;
  const d = new Date();
  document.getElementById('today-date').textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  const total = stage.tasks.length;
  const done = stage.tasks.filter(t => dc[t.id]).length;
  document.getElementById('tasks-count').textContent = `${done} / ${total} 완료`;
  document.getElementById('tasks-progress-fill').style.width = (total ? done/total*100 : 0) + '%';

  const list = document.getElementById('tasks-list');
  list.innerHTML = '';
  stage.tasks.forEach(task => {
    const checked = !!dc[task.id];
    const item = document.createElement('div');
    item.className = 'task-item' + (checked ? ' checked' : '');
    item.innerHTML = `
      <div class="task-check"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="#0b0f1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="task-text">${task.text}</span>
      <span class="tag tag-${task.tag}">${{h:'헌법',f:'형사법',p:'실전',x:'공통'}[task.tag]}</span>
    `;
    item.addEventListener('click', () => {
      if (!data.checks[dk]) data.checks[dk] = {};
      data.checks[dk][task.id] = !data.checks[dk][task.id];
      save(); renderTodo();
    });
    list.appendChild(item);
  });
}

function renderHoedok() {
  renderHoedokSection('theory', '이론', 'tTarget', 'hoedok-theory');
  renderHoedokSection('past', '기출', 'pTarget', 'hoedok-past');
}

function renderHoedokSection(key, label, targetKey, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const fc = { '헌법':'fill-h', '형사법':'fill-f', '경찰학':'fill-p' };
  SUB_ORDER.forEach(sub => {
    const hd = data.hoedok[sub];
    const cur = hd[key], tgt = hd[targetKey];
    const pct = tgt > 0 ? Math.min(cur/tgt*100, 100) : 0;
    const row = document.createElement('div');
    row.className = 'hoedok-row';
    row.innerHTML = `
      <div class="hoedok-subject">${sub}</div>
      <div class="hoedok-type">${label}</div>
      <div class="hoedok-progress">
        <div class="hoedok-bar"><div class="hoedok-fill ${fc[sub]}" style="width:${pct}%"></div></div>
        <div class="hoedok-nums"><strong>${cur}</strong> / <span class="target-edit" data-sub="${sub}" data-key="${targetKey}">${tgt}회</span></div>
      </div>
      <div class="hoedok-controls">
        <button class="ctrl-btn" data-sub="${sub}" data-field="${key}" data-delta="-1">−</button>
        <button class="ctrl-btn plus" data-sub="${sub}" data-field="${key}" data-delta="1">+</button>
      </div>
    `;
    row.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        data.hoedok[btn.dataset.sub][btn.dataset.field] = Math.max(0, data.hoedok[btn.dataset.sub][btn.dataset.field] + parseInt(btn.dataset.delta));
        save(); renderHoedok();
      });
    });
    row.querySelector('.target-edit').addEventListener('click', function() {
      const val = prompt(`${this.dataset.sub} ${label} 목표 회독수:`, data.hoedok[this.dataset.sub][this.dataset.key]);
      if (val !== null && !isNaN(parseInt(val)) && parseInt(val) >= 0) {
        data.hoedok[this.dataset.sub][this.dataset.key] = parseInt(val);
        save(); renderHoedok();
      }
    });
    container.appendChild(row);
  });
}

document.getElementById('score-date').value = todayStr();

document.getElementById('score-add-btn').addEventListener('click', () => {
  const date = document.getElementById('score-date').value;
  const sub = document.getElementById('score-sub').value;
  const val = parseInt(document.getElementById('score-val').value);
  if (!date || isNaN(val) || val < 0 || val > 40) { alert('날짜와 0~40 사이의 점수를 입력하세요.'); return; }
  data.scores.push({ date, sub, val });
  data.scores.sort((a, b) => a.date.localeCompare(b.date));
  document.getElementById('score-val').value = '';
  save(); renderScores();
});

function renderScores() { renderScoreChart(); renderScoreList(); }

function renderScoreChart() {
  const wrap = document.getElementById('score-chart-wrap');
  if (!data.scores.length) {
    wrap.innerHTML = '<div class="chart-empty">아직 점수 기록이 없습니다.<br>위 폼에서 첫 점수를 기록해보세요.</div>';
    return;
  }
  const W = wrap.clientWidth || 600, H = 200;
  const PAD = { top:16, right:20, bottom:30, left:36 };
  const cW = W-PAD.left-PAD.right, cH = H-PAD.top-PAD.bottom;
  const dates = [...new Set(data.scores.map(s => s.date))].sort();
  const xS = i => dates.length > 1 ? PAD.left+(i/(dates.length-1))*cW : PAD.left+cW/2;
  const yS = v => PAD.top+cH-(v/40)*cH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  [0,10,20,30,40].forEach(v => {
    const y = yS(v);
    svg += `<line x1="${PAD.left}" y1="${y}" x2="${W-PAD.right}" y2="${y}" stroke="#2a3a52" stroke-width="1"/>`;
    svg += `<text x="${PAD.left-6}" y="${y+4}" fill="#556070" font-size="10" text-anchor="end" font-family="IBM Plex Mono,monospace">${v}</text>`;
  });
  const step = Math.max(1, Math.floor(dates.length/6));
  dates.forEach((d,i) => {
    if (i%step===0 || i===dates.length-1)
      svg += `<text x="${xS(i)}" y="${H-4}" fill="#556070" font-size="9" text-anchor="middle" font-family="IBM Plex Mono,monospace">${d.slice(5)}</text>`;
  });
  SUB_ORDER.forEach(sub => {
    const pts = data.scores.filter(s => s.sub===sub).map(s => ({x:xS(dates.indexOf(s.date)),y:yS(s.val),val:s.val}));
    if (!pts.length) return;
    const color = SUB_COLORS[sub];
    if (pts.length > 1)
      svg += `<path d="${pts.map((p,i)=>(i===0?'M':'L')+p.x+','+p.y).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>`;
    pts.forEach(p => {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="#0b0f1a" stroke-width="2"/>`;
      svg += `<text x="${p.x}" y="${p.y-8}" fill="${color}" font-size="9" text-anchor="middle" font-family="IBM Plex Mono,monospace">${p.val}</text>`;
    });
  });
  svg += '</svg>';
  wrap.innerHTML = svg;
}

function renderScoreList() {
  const list = document.getElementById('score-list');
  list.innerHTML = '';
  if (!data.scores.length) { list.innerHTML = '<div class="no-data">기록이 없습니다.</div>'; return; }
  [...data.scores].reverse().forEach((s, ri) => {
    const realIdx = data.scores.length-1-ri;
    const li = document.createElement('li');
    li.className = 'score-item';
    li.innerHTML = `
      <span class="score-date">${s.date}</span>
      <span class="tag tag-${s.sub==='헌법'?'h':s.sub==='형사법'?'f':'p'}">${s.sub}</span>
      <span class="score-sub"></span>
      <span class="score-val" style="color:${SUB_COLORS[s.sub]}">${s.val}</span>
      <button class="score-del">삭제</button>
    `;
    li.querySelector('.score-del').addEventListener('click', () => { data.scores.splice(realIdx,1); save(); renderScores(); });
    list.appendChild(li);
  });
}

function addWeak() {
  const sub = document.getElementById('weak-sub').value;
  const tx = document.getElementById('weak-text').value.trim();
  if (!tx) return;
  data.weak.push({ sub, tx, done: false });
  document.getElementById('weak-text').value = '';
  save(); renderWeak();
}

document.getElementById('weak-add-btn').addEventListener('click', addWeak);
document.getElementById('weak-text').addEventListener('keydown', e => { if (e.key==='Enter') addWeak(); });

function renderWeak() {
  const list = document.getElementById('weak-list');
  const empty = document.getElementById('weak-empty');
  list.innerHTML = '';
  const sorted = data.weak.map((w,i) => ({...w,_i:i})).sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return SUB_ORDER.indexOf(a.sub) - SUB_ORDER.indexOf(b.sub);
  });
  empty.style.display = sorted.length ? 'none' : 'block';
  sorted.forEach(w => {
    const tm = {'헌법':'h','형사법':'f','경찰학':'p'};
    const li = document.createElement('li');
    li.className = 'weak-item' + (w.done ? ' done' : '');
    li.innerHTML = `
      <span class="tag tag-${tm[w.sub]}">${w.sub}</span>
      <span class="weak-content">${escHtml(w.tx)}</span>
      <div class="weak-actions">
        <button class="weak-resolve-btn">${w.done ? '↩ 되돌리기' : '✓ 해결'}</button>
        <button class="weak-del-btn">삭제</button>
      </div>
    `;
    li.querySelector('.weak-resolve-btn').addEventListener('click', () => { data.weak[w._i].done=!data.weak[w._i].done; save(); renderWeak(); });
    li.querySelector('.weak-del-btn').addEventListener('click', () => { data.weak.splice(w._i,1); save(); renderWeak(); });
    list.appendChild(li);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

renderDday(); renderTodo(); renderHoedok(); renderScores(); renderWeak();

window.addEventListener('resize', () => {
  if (document.getElementById('tab-scores').classList.contains('active')) renderScoreChart();
});
</script>
</body>
</html>
